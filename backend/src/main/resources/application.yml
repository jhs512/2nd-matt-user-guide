server:
  port: ${PORT:8080}
  error:
    include-message: always
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  admin-username: ${ADMIN_USERNAME}
  admin-password-hash: ${ADMIN_PASSWORD_HASH}
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
